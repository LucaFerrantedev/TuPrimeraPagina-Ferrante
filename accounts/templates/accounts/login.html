{% extends 'productos/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4">Ingresar</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-light">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-accent w-100 py-2">Acceder</button>
            </form>
            <p class="text-center mt-3 small text-secondary">¿No tienes cuenta? <a href="{% url 'register' %}" class="text-decoration-none" style="color: var(--accent);">Regístrate</a></p>
        </div>
    </div>
</div>
{% endblock %}
