{% extends 'productos/base.html' %}
{% block title %}Cambiar Contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-lg p-4">
            <h3 class="text-white text-center mb-4">Cambiar Contraseña</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-light">{{ form.as_p }}</div>
                <button type="submit" class="btn btn-accent w-100 mt-2 py-2">Actualizar Contraseña</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
