{% extends 'productos/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-5 text-center shadow">
            {% if user.avatar %}
            <img src="{{ user.avatar.url }}" class="rounded-circle mb-4 mx-auto border border-3" style="width: 150px; height: 150px; object-fit: cover; border-color: var(--accent) !important;">
            {% endif %}
            <h2 class="text-white fw-bold">{{ user.first_name }} {{ user.last_name }}</h2>
            <p class="text-secondary mb-4">@{{ user.username }} | {{ user.email }}</p>
            <div class="text-start mb-4 p-3 bg-dark rounded">
                <p class="mb-1"><small class="text-muted">Teléfono:</small> {{ user.telefono|default:"No cargado" }}</p>
                <p class="mb-0"><small class="text-muted">País:</small> {{ user.pais|default:"No cargado" }}</p>
            </div>
            <div class="d-grid gap-2">
                <a href="{% url 'profile_change' %}" class="btn btn-accent">Editar Perfil</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
