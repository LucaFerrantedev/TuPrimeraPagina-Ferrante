{% extends 'productos/base.html' %}

{% block title %}Crear Cuenta - HardwareHub{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <h3 class="text-white fw-bold">Únete a HardwareHub</h3>
                <p class="text-secondary small">Crea tu cuenta para gestionar inventario.</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-light">
                    {{ form.as_p }}
                </div>
                
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-accent py-2 fw-bold">Crear Cuenta</button>
                </div>
            </form>
            
            <p class="text-center mt-4 small text-secondary">
                ¿Ya tienes una cuenta? 
                <a href="{% url 'login' %}" class="text-decoration-none" style="color: var(--accent);">Inicia Sesión aquí</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
