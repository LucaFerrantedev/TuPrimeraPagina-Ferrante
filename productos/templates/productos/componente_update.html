{% extends 'productos/base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card p-4 shadow-lg">
            <h3 class="fw-bold text-white mb-4 text-center">Editar Componente</h3>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="mb-3 text-light">
                    {{ form.as_p }}
                </div>
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-accent py-2 fw-bold">Guardar Componente</button>
                    <a href="{% url 'productos_list' %}" class="btn btn-outline-secondary py-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
