<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Cargar Componente - HardwareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f0f0f; color: #f8fafc; }.card { background-color: #1a1a1a; border: 1px solid #334155; }</style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card p-4">
                    <h3 class="mb-4 text-center">Registro de Componente</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">{{ form.as_p }}</div>
                        <button type="submit" class="btn btn-primary w-100" style="background-color: #6366f1; border: none;">Registrar Producto</button>
                    </form>
                    <div class="d-flex justify-content-between mt-3">
                        <a href="{% url 'home' %}" class="text-secondary small text-decoration-none">← Inicio</a>
                        <a href="{% url 'productos_list' %}" class="text-secondary small text-decoration-none">Ver Catálogo →</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
