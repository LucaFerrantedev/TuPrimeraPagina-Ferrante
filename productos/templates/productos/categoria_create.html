<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Agregar Categoría - HardwareHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f0f0f; color: #f8fafc; }.card { background-color: #1a1a1a; border: 1px solid #334155; }</style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card p-4">
                    <h3 class="mb-4 text-center">Nueva Categoría</h3>
                    <form method="POST">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-primary w-100 mt-3" style="background-color: #6366f1; border: none;">Guardar</button>
                    </form>
                    <a href="{% url 'home' %}" class="text-center text-secondary mt-3 small text-decoration-none">Cancelar</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
