<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HardwareHub{% endblock %}</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --accent: #6366f1;
        }
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .btn-accent {
            background-color: var(--accent);
            color: white;
            border: none;
        }
        .btn-accent:hover {
            background-color: #4f46e5;
            color: white;
        }
        .text-accent {
            color: var(--accent) !important;
        }
        .card {
            background-color: #1e1e1e;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top mb-5" style="background-color: #000000;">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="{% url 'home' %}">HARDWARE<span style="color: var(--accent);">HUB</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'productos_list' %}">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'about' %}">Acerca de mí</a></li>
                    {% if user.is_superuser %}
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'marca_create' %}">Marcas</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'categoria_create' %}">Categorías</a></li>
                    {% endif %}
                </ul>
                
                <div class="d-flex align-items-center gap-3">
                    <form class="d-flex" action="{% url 'productos_list' %}" method="GET">
                        <input class="form-control form-control-sm me-2 bg-dark text-white border-secondary" type="search" placeholder="Buscar..." name="nombre">
                    </form>
                    
                    {% if user.is_authenticated %}
                        <div class="dropdown">
                            <a class="btn btn-outline-light btn-sm dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                {{ user.username }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end">
                                <li><a class="dropdown-item" href="{% url 'account_detail' %}">Mi Perfil</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><form action="{% url 'logout' %}" method="POST">{% csrf_token %}<button class="dropdown-item text-danger">Salir</button></form></li>
                            </ul>
                        </div>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">Ingresar</a>
                        <a href="{% url 'register' %}" class="btn btn-accent btn-sm">Registro</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
