<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HardwareHub | Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --accent: #6366f1; }
        body { background-color: #0f0f0f; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .navbar { background-color: rgba(15, 15, 15, 0.9) !important; backdrop-filter: blur(5px); border-bottom: 1px solid #334155; }
        .btn-accent { background-color: var(--accent); color: white; border: none; font-weight: 600; transition: 0.3s; }
        .btn-accent:hover { background-color: #4f46e5; transform: translateY(-2px); color: white; }
        .hero { padding: 100px 0; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.05), transparent); }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="{% url 'home' %}">HARDWARE<span style="color: var(--accent);">HUB</span></a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'productos_list' %}">Inventario</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'marca_create' %}">Marcas</a></li>
                    <li class="nav-item"><a class="nav-link text-secondary" href="{% url 'categoria_create' %}">Categorías</a></li>
                </ul>
                <form class="d-flex" action="{% url 'productos_list' %}" method="GET">
                    <input class="form-control form-control-sm me-2 bg-dark text-white border-secondary" type="search" placeholder="Buscar modelo..." name="nombre">
                    <button class="btn btn-outline-light btn-sm" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container hero text-center">
        <h1 class="display-3 fw-bold mb-4">Gestiona tu Hardware con Precisión</h1>
        <p class="lead text-secondary mb-5">Sistema minimalista para el control total de componentes, marcas y categorías.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'componente_create' %}" class="btn btn-accent px-4 py-2">Nuevo Componente</a>
            <a href="{% url 'productos_list' %}" class="btn btn-outline-secondary px-4 py-2">Ver Catálogo</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
