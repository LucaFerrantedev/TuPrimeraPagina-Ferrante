{% extends 'productos/base.html' %}

{% block title %}Cargar Datos - HardwareHub{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="mb-4 text-center">Registro de Información</h3>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3 text-light">
                    {{ form.as_p }}
                </div>
                <button type="submit" class="btn btn-accent w-100 mt-3 py-2">Guardar Registro</button>
            </form>
            <a href="{% url 'home' %}" class="text-center text-secondary mt-3 small text-decoration-none">← Cancelar y volver</a>
        </div>
    </div>
</div>
{% endblock %}
